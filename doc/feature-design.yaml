current_integration_flow:
  - step: 1
    name: "Slack event"
    components:
      - "Slack"
      - "handleAppMention"
  - step: 2
    name: "Message persistence"
    components:
      - "messageStore"
      - "Supabase"
  - step: 3
    name: "Conversation context"
    components:
      - "contextService"
      - "conversationSummaryService"
  - step: 4
    name: "Search decision"
    components:
      - "searchDecision"
  - step: 5
    name: "Search provider"
    components:
      - "searchService"
      - "Tavily"
      - "Exa"
      - "You.com"
  - step: 6
    name: "Evidence selection"
    components:
      - "evidenceSelector"
      - "searchSourceEvaluator"
  - step: 7
    name: "Content integration"
    components:
      - "searchContextBuilder"
      - "content adapters"
  - step: 8
    name: "Gemini generation"
    components:
      - "promptBuilder"
      - "geminiService"
  - step: 9
    name: "Slack response"
    components:
      - "slackService"
      - "Sources display"

configuration:
  environment:
    required_for_core:
      - "SYSTEM_PROMPT"
      - "SUPABASE_URL"
      - "SUPABASE_KEY"
    search_providers:
      - name: "Tavily"
        key: "TAVILY_API_KEY"
        enabled_flag: "SEARCH_TAVILY_ENABLED"
      - name: "Exa"
        key: "EXA_API_KEY"
        enabled_flag: "SEARCH_EXA_ENABLED"
      - name: "You.com"
        key: "YDC_API_KEY"
        enabled_flag: "SEARCH_YOU_ENABLED"
  content_limits:
    - "MAX_MESSAGE_CONTENTS"
    - "MAX_SLACK_FILE_SIZE"
    - "SLACK_FILE_TIMEOUT_MS"
    - "MAX_URL_RESPONSE_SIZE"
    - "URL_TIMEOUT_MS"
    - "MAX_CONTENT_TEXT_LENGTH"
    - "MAX_CSV_ROWS"
  search_limits:
    - "SEARCH_MAX_QUERY_LENGTH"
    - "SEARCH_MAX_RESULTS"
    - "SEARCH_MAX_DOMAINS"
    - "SEARCH_MAX_PROVIDER_ATTEMPTS"

security:
  principles:
    - "External URLs are untrusted input."
    - "Search results are untrusted external content."
    - "External content must not override system instructions."
    - "SSRF protection is required for URL fetching."
    - "Input size and result count must be bounded."
    - "API keys must remain in environment variables."
  web_search_specific:
    - "Do not treat snippets or page text as executable instructions."
    - "Prefer multiple independent sources when factual confidence matters."
    - "Expose source URLs in the final Slack response."

